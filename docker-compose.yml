# Auto-hébergement d'OllamaLocloud (VPS, NAS, machine perso…)
# Usage : docker compose up -d   →   http://localhost:7860
services:
  ollamalocloud:
    build: .
    ports:
      - "7860:7860"
    environment:
      # Modèles téléchargés au démarrage (séparés par des virgules)
      - MODEL_LIST=${MODEL_LIST:-llama3.2:1b}
      # Clé d'accès optionnelle : décommentez et choisissez une valeur
      # - APP_TOKEN=changez-moi
    volumes:
      # Conserve les modèles entre les redémarrages
      - ollama-models:/home/appuser/.ollama
    restart: unless-stopped

volumes:
  ollama-models:
